<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數學冒險王國</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a href="#/" class="logo">🗺️ 數學冒險王國</a>
  <div class="saves">
    <button id="exp" class="sbtn">💾 存檔</button>
    <button id="imp" class="sbtn">📂 讀檔</button>
  </div>
  <div class="stats">
    <button id="me" class="link" title="更改頭像與暱稱" style="text-decoration:none"></button>
    <span id="lv">Lv.1</span>
    <div class="xpbar"><div id="xpfill"></div></div>
    <span id="xp">0 XP</span>
    <span id="streak" title="連續學習天數">🔥0</span>
  </div>
</header>
<main id="view"></main>
<footer class="foot">
  <button id="goldbtn" class="link">🔑 金手指</button>
  <input id="impfile" type="file" accept=".json" hidden>
</footer>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/gen.js"></script>
<script defer src="js/widgets.js"></script>
<script defer src="data/ch0.js"></script>
<script defer src="js/engine.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
